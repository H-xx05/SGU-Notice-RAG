name: CI

# 【F 组维护】三绿门槛：lint / test / build。
# 主分支上这三条任一失败即阻塞合并。
# check-contract.sh 失败 = 契约被破坏（前端调了契约外的路径、或字段名漂移），
# 这不是格式问题，必须回退或走 contract-change: PR 流程，不允许 --no-verify 绕过。

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 契约冻结校验
        run: bash .claude/skills/sgu-notice-rag-dev/scripts/check-contract.sh

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api-server/go.sum
      - name: gofmt
        working-directory: api-server
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then echo "未格式化文件:"; echo "$fmt_out"; exit 1; fi
      - name: go vet
        working-directory: api-server
        run: go vet ./...

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff
        run: |
          pip install --disable-pip-version-check "ruff==0.8.4"
          ruff check ingestion rag-core eval

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 前端类型检查 + 格式检查
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api-server/go.sum
      - name: go test
        working-directory: api-server
        run: go test ./... -race -count=1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 依赖
        run: |
          pip install --disable-pip-version-check pytest ruff
          # rag-core 的测试要 import app.*，装成可编辑包最省事
          pip install --disable-pip-version-check -e ./rag-core
      # 三个子项目各自有 pyproject.toml 里的 pytest 配置（pythonpath/testpaths），
      # 所以必须分别 cd 进去跑，不能从根目录一次性传三条路径。
      - name: pytest（离线用例，不加载模型）
        run: |
          set -e
          ( cd ingestion && python -m pytest -q )
          ( cd rag-core   && python -m pytest -q )
          ( cd eval       && python -m pytest -q )

      - name: 评估指标黄金基线
        run: ( cd eval && python -m runner.cli check && python -m runner.cli baseline )

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 前端单元测试
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 部署静态校验（不启动容器）
        run: |
          # compose 文件本身语法 / 依赖 / 变量解析是否成立
          docker compose config -q
          docker compose --profile models config -q
          # 服务清单必须与 docs/deployment.md §3 的表一致
          got=$(docker compose config --services | sort | tr '\n' ' ')
          want="api-server frontend nginx postgres qdrant qdrant-init rag-core redis "
          echo "services: $got"
          [ "$got" = "$want" ] || { echo "✗ 服务清单不一致"; echo "  期望: $want"; exit 1; }
      - name: 初始化脚本行为测试
        # ubuntu-latest 自带 python3，这里不额外装 setup-python：
        # 脚本只用标准库，装一遍反而多 20 秒。
        run: python3 infra/scripts/test-init-qdrant.py
      - name: docker compose build（只构建不启动）
        run: docker compose build --parallel
