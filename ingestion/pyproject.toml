[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgu-ingestion"
version = "0.1.0"
description = "韶关学院教务通知采集与 ETL（合规受限，纯标准库）"
requires-python = ">=3.11"
dependencies = []          # 刻意零依赖：HTMLParser 是标准库，抓取只用 urllib

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
ingestion = "ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
