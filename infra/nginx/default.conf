# 【F 所有】Nginx 统一入口
# 路由冻结：/ → 前端静态；/api/ → Go API；/healthz → Go API；/internal/ → 404（内部接口不出网）

upstream api_backend {
    server api-server:8080;
    keepalive 32;
}

# 前端是**独立容器**（自带 nginx + SPA 回落），这里只做转发。
# 不要改成挂载 `./frontend/dist` —— dist 是构建产物且已 gitignore，
# 在干净 clone 的机器上那个目录不存在，nginx 会启动成功但返回空目录列表。
upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 上传/请求体上限（问答请求很小，这里只是兜底）
    client_max_body_size 2m;

    # ---------- 健康检查 ----------
    location = /healthz {
        proxy_pass http://api_backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ---------- 内部接口：拒绝外网访问 ----------
    location /internal/ {
        return 404;
    }

    # ---------- 对外 API ----------
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # SSE 必需：关闭缓冲、关闭缓存、长读超时
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 前端 SPA（转发给 frontend 容器） ----------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 静态资源的强缓存由 frontend 容器自己发，这里不重复加
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
