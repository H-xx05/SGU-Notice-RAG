services:
  # ==========================================================
  # 【F 所有】compose 服务名与端口为冻结项（SKILL.md §6.1）
  # A—E 不得自行增删服务；需要新依赖先找 F。
  #
  # 本文件有 7 个常驻服务 + 2 个一次性/可选服务：
  #   qdrant-init  一次性，建完 collection 就退出（无 profile，每次 up 都跑）
  #   model-puller 可选，用 --profile models 手动跑
  # ==========================================================

  nginx:
    image: nginx:1.27-alpine
    container_name: sgu-nginx
    ports:
      - "8088:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-server:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # 用 127.0.0.1 而不是 localhost：Alpine 容器的 /etc/hosts 里
      # localhost 同时对应 127.0.0.1 和 ::1，解析器会优先给 ::1，
      # 而 nginx 默认只监听 IPv4，于是探针拿到 Connection refused。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite 在 build 期内联环境变量，运行期设置无效 —— 必须是 build args
      #
      # 默认 **false**：这套 compose 把后端全起起来了，前端再挂 Mock 就成了
      # "容器全 healthy、页面也正常、但显示的是假数据" —— 最难查的一类假成功。
      # Vite 的 env 优先级是 process.env > .env 文件，所以这个 ARG 会盖过
      # frontend/.env.production 里的 false；`pnpm dev` 不受影响（走 .env.development）。
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: sgu-frontend
    ports:
      - "5173:80"
    healthcheck:
      # 同上：必须写 127.0.0.1，写 localhost 会被解析成 ::1 而 nginx 只听 IPv4。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: sgu-api-server
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
      RAG_CORE_URL: ${RAG_CORE_URL:-http://rag-core:8000}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-8}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://sgu:sgu@postgres:5432/sgu?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # rag-core 的 healthcheck 要等模型加载完才绿（stub 模式秒过）。
      # 这里用 service_started 而不是 service_healthy：api-server 在 rag-core
      # 还没准备好时也能提供 /healthz 与 /api/v1/notices，把它的启动绑在
      # B 的模型加载上只会让整条链一起卡住。
      rag-core:
        condition: service_started
    healthcheck:
      # 统一写 127.0.0.1：Go 默认双栈监听，localhost 目前也能通，
      # 但和 frontend/nginx 保持一致，避免以后再踩 IPv6 优先解析的坑。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rag-core:
    build:
      context: ./rag-core
      dockerfile: Dockerfile
      args:
        # 0 = 不装 torch/FlagEmbedding（镜像约 300 MB，只能跑 RAG_STUB_MODE=true）
        # 1 = 装模型依赖（约 4.5 GB，才能跑真实检索）
        # 两个服务的这个 arg 必须一起改，否则 model-puller 下完模型、rag-core 却 import 不了。
        WITH_MODELS: ${WITH_MODELS:-0}
    container_name: sgu-rag-core
    environment:
      VECTOR_DB_URL: ${VECTOR_DB_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-sgu_notices}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_TOP_K: ${RAG_TOP_K:-20}
      # 默认 true：干净机器上没下载模型也能把整条链路跑通（见 docs/deployment.md §2）。
      # 模型下好之后在 .env 里改成 false，才是真实检索。
      RAG_STUB_MODE: ${RAG_STUB_MODE:-true}
      # 与下面 model-cache 卷的挂载点一致；两处不同就等于每次重建都重下模型
      MODEL_CACHE_DIR: /models
      HF_HOME: /models
      POSTGRES_URL: ${POSTGRES_URL:-postgres://sgu:sgu@postgres:5432/sgu?sslmode=disable}
      TZ: ${TZ:-Asia/Shanghai}
    # **不映射到宿主机**：`/internal/*` 是内部接口，只有 C 该调用它。
    # 映射成 8000:8000 会让它绕过 nginx 直接出网，`infra/nginx/default.conf`
    # 里那句 `location /internal/ { return 404; }` 也就形同虚设。
    # 需要本地调试时：docker compose exec rag-core curl -s 127.0.0.1:8000/internal/health
    expose:
      - "8000"
    depends_on:
      qdrant:
        condition: service_healthy
      # 必须等 collection 建好：rag-core 的 ping() 打的是 get_collection，
      # collection 不存在会被判定为 down，/internal/health 直接 503。
      qdrant-init:
        condition: service_completed_successfully
    healthcheck:
      # 同一原因：uvicorn 默认双栈，但统一用 127.0.0.1。
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/internal/health').status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    volumes:
      - model-cache:/models
    restart: unless-stopped

  # ---------- 一次性：建 Qdrant collection 与 payload 索引 ----------
  # 为什么必须是独立服务而不是写进 rag-core 启动脚本：
  # collection 的 schema（向量维度、距离函数、索引类型）属于**数据层契约**，
  # 藏在 B 的启动路径里就等于让检索代码顺手改数据库结构。
  # 做成一次性服务后，`docker compose up` 的语义是"先把库准备好，再起服务"。
  qdrant-init:
    image: curlimages/curl:8.10.1
    container_name: sgu-qdrant-init
    volumes:
      - ./infra/scripts/init-qdrant.sh:/init-qdrant.sh:ro
    entrypoint: ["sh", "/init-qdrant.sh"]
    environment:
      VECTOR_DB_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-sgu_notices}
    depends_on:
      qdrant:
        condition: service_healthy
    # 跑完就退出，不要重启。失败时 rag-core 会因
    # service_completed_successfully 不满足而拒绝启动 —— 这是有意的：
    # 一个没有 collection 的检索服务，比一个起不来的检索服务更难排查。
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sgu-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sgu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgu}
      POSTGRES_DB: ${POSTGRES_DB:-sgu}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgu} -d ${POSTGRES_DB:-sgu}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sgu-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ==========================================================
  # profile=models：手动执行一次，预下载模型权重（可选）
  #   docker compose --profile models run --rm model-puller
  # ==========================================================
  model-puller:
    profiles: ["models"]
    build:
      context: ./rag-core
      dockerfile: Dockerfile
      args:
        # 必须与 rag-core 一致。设 0 时镜像里没有 huggingface_hub，
        # pull_models 会明确报错退出 1（而不是假装成功）。
        WITH_MODELS: ${WITH_MODELS:-0}
    container_name: sgu-model-puller
    command: ["python", "-m", "app.tools.pull_models"]
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      MODEL_CACHE_DIR: /models
      HF_HOME: /models
    volumes:
      # 与 rag-core 用同一个卷，否则下完等于没下
      - model-cache:/models

volumes:
  qdrant-data:
  postgres-data:
  redis-data:
  model-cache:

networks:
  default:
    name: sgu-net
    driver: bridge
