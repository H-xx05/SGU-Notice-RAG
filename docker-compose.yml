services:
  # ==========================================================
  # 【F 所有】compose 服务名与端口为冻结项（SKILL.md §6.1）
  # A—E 不得自行增删服务；需要新依赖先找 F。
  # ==========================================================

  nginx:
    image: nginx:1.27-alpine
    container_name: sgu-nginx
    ports:
      - "8088:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-server:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite 在 build 期内联环境变量，运行期设置无效 —— 必须是 build args
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: sgu-frontend
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: sgu-api-server
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
      RAG_CORE_URL: ${RAG_CORE_URL:-http://rag-core:8000}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-8}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://sgu:sgu@postgres:5432/sgu?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-core:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rag-core:
    build:
      context: ./rag-core
      dockerfile: Dockerfile
    container_name: sgu-rag-core
    environment:
      VECTOR_DB_URL: ${VECTOR_DB_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-sgu_notices}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_TOP_K: ${RAG_TOP_K:-20}
      RAG_STUB_MODE: ${RAG_STUB_MODE:-false}
      # 与下面 model-cache 卷的挂载点一致；两处不同就等于每次重建都重下模型
      MODEL_CACHE_DIR: /models
      HF_HOME: /models
      POSTGRES_URL: ${POSTGRES_URL:-postgres://sgu:sgu@postgres:5432/sgu?sslmode=disable}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/internal/health').status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    volumes:
      - model-cache:/models
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sgu-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sgu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgu}
      POSTGRES_DB: ${POSTGRES_DB:-sgu}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgu} -d ${POSTGRES_DB:-sgu}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sgu-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ==========================================================
  # profile=models：手动执行一次，预下载模型权重（可选）
  #   docker compose --profile models run --rm rag-core python -m app.tools.pull_models
  # ==========================================================
  model-puller:
    profiles: ["models"]
    build:
      context: ./rag-core
      dockerfile: Dockerfile
    container_name: sgu-model-puller
    command: ["python", "-m", "app.tools.pull_models"]
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      MODEL_CACHE_DIR: /models
      HF_HOME: /models
    volumes:
      # 与 rag-core 用同一个卷，否则下完等于没下
      - model-cache:/models

volumes:
  qdrant-data:
  postgres-data:
  redis-data:
  model-cache:

networks:
  default:
    name: sgu-net
    driver: bridge
